<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus</title>

<style>
:root {
  --bg: #f8f7f3;
  --panel: #fffefa;
  --soft: #eeece5;
  --line: #dfddd5;
  --text: #302e2a;
  --muted: #85817a;
  --accent: #c96e4b;
  --danger: #b64d47;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  color: var(--text);
  background: var(--bg);
  font-family: Georgia, serif;
}

button,
input,
textarea,
select {
  color: inherit;
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

button:focus-visible,
textarea:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.hidden {
  display: none !important;
}

.app {
  display: flex;
  width: 100%;
  height: 100dvh;
}

.sidebar {
  display: flex;
  width: 236px;
  flex: 0 0 236px;
  flex-direction: column;
  padding: 22px 12px 13px;
  border-right: 1px solid var(--line);
  background: #f2f1ed;
  transition: .2s ease;
}

.sidebar.closed {
  width: 0;
  flex-basis: 0;
  padding: 0;
  overflow: hidden;
  border: 0;
}

.brand {
  margin: 4px 10px 28px;
  font-size: 24px;
  letter-spacing: -1px;
}

.new-chat {
  align-self: flex-start;
  padding: 8px 9px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--text);
  font-family: Arial, sans-serif;
  font-size: 12px;
}

.new-chat:hover {
  background: var(--soft);
}

.history {
  flex: 1;
  overflow-y: auto;
  margin-top: 22px;
}

.history-label {
  margin: 19px 8px 8px;
  color: var(--muted);
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 1.3px;
  text-transform: uppercase;
}

.chat-row {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-bottom: 2px;
  border-radius: 8px;
}

.chat-row.active {
  background: var(--soft);
}

.chat-title {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  padding: 9px;
  border: 0;
  background: transparent;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: Arial, sans-serif;
  font-size: 12px;
}

.chat-pin,
.chat-delete {
  width: 27px;
  height: 30px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-family: Arial, sans-serif;
  font-size: 13px;
}

.chat-pin.active {
  color: var(--accent);
}

.profile-button {
  width: 100%;
  padding: 13px 8px 3px;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  text-align: left;
  font-family: Arial, sans-serif;
  font-size: 12px;
}

.main {
  display: flex;
  min-width: 0;
  flex: 1;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 62px;
  padding: 11px 27px;
}

.icon-button,
.model-trigger {
  border: 0;
  border-radius: 8px;
  background: transparent;
}

.icon-button {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  padding: 0;
  color: var(--muted);
  font-family: Arial, sans-serif;
  font-size: 17px;
}

.icon-button:hover,
.model-trigger:hover {
  background: var(--soft);
}

.page-title {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  color: var(--muted);
  text-align: right;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
}

.model-trigger {
  display: flex;
  max-width: min(310px, 48vw);
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  text-align: left;
  white-space: nowrap;
  font-size: 15px;
}

.model-trigger::after {
  content: "";
  width: 6px;
  height: 6px;
  border-right: 1px solid currentColor;
  border-bottom: 1px solid currentColor;
  transform: rotate(45deg) translateY(-2px);
}

.connection {
  color: var(--muted);
  font: 10px Arial, sans-serif;
}

.connection.connected {
  color: #5c8554;
}

.scroll {
  flex: 1;
  overflow-y: auto;
  padding: 28px 22px 25px;
}

.welcome {
  width: min(650px, 100%);
  margin: 15vh auto 0;
  text-align: center;
}

.welcome h1 {
  margin: 0 0 15px;
  font-size: clamp(38px, 5vw, 58px);
  font-weight: normal;
  letter-spacing: -2px;
  line-height: 1.05;
}

.welcome p {
  max-width: 410px;
  margin: auto;
  color: var(--muted);
  line-height: 1.6;
}

.messages {
  width: min(760px, 100%);
  margin: auto;
}

.message {
  margin-bottom: 34px;
}

.message.user {
  text-align: right;
}

.message-label {
  margin-bottom: 7px;
  color: var(--muted);
  font: 10px Arial, sans-serif;
}

.message.user .message-label {
  text-align: right;
}

.message-body {
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.user .message-body {
  display: inline-block;
  max-width: 90%;
  padding: 11px 15px;
  border-radius: 15px;
  background: var(--soft);
  text-align: left;
}

.message.error .message-body {
  color: var(--danger);
}

.message img {
  display: block;
  max-width: 100%;
  max-height: 520px;
  margin: 12px 0;
  border-radius: 10px;
}

pre {
  overflow: auto;
  margin: 12px 0;
  padding: 13px;
  border-radius: 8px;
  background: var(--soft);
  font: 12px/1.6 monospace;
  white-space: pre;
}

.tools {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.tools button {
  padding: 5px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font: 10px Arial, sans-serif;
}

.waiting {
  display: flex;
  align-items: center;
  gap: 8px;
  width: min(760px, 100%);
  margin: 0 auto 17px;
  color: var(--muted);
  font: 11px Arial, sans-serif;
}

.waiting-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  50% {
    opacity: .25;
  }
}

.composer-area {
  padding: 7px 22px 20px;
}

.composer {
  width: min(760px, 100%);
  margin: auto;
}

.notice {
  min-height: 20px;
  margin: 0 3px 5px;
  color: var(--muted);
  white-space: pre-wrap;
  font: 11px Arial, sans-serif;
}

.attachments {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 6px;
}

.attachment {
  max-width: 220px;
  overflow: hidden;
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  text-overflow: ellipsis;
  white-space: nowrap;
  font: 10px Arial, sans-serif;
}

.composer-box {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
}

.composer-box:focus-within {
  border-color: #b9b6ae;
}

#input {
  display: block;
  width: 100%;
  min-height: 78px;
  max-height: 210px;
  padding: 16px;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 9px 9px;
}

.toolbar-button,
.send-button {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--text);
  font-family: Arial, sans-serif;
  font-size: 17px;
}

.toolbar-button:hover,
.send-button:hover {
  background: var(--soft);
}

.voice-input {
  color: var(--accent);
}

.send-button {
  margin-left: auto;
  font-size: 16px;
}

#mode {
  display: none;
}

.model-picker {
  position: fixed;
  z-index: 30;
  width: min(350px, calc(100vw - 24px));
  max-height: calc(100vh - 24px);
  overflow-y: auto;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--panel);
  box-shadow: 0 16px 45px #0002;
}

.picker-title {
  padding: 8px;
  color: var(--muted);
  font: 10px Arial, sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.model-section {
  border-top: 1px solid var(--line);
}

.model-section:first-of-type {
  border-top: 0;
}

.section-title {
  padding: 9px 8px 5px;
  color: var(--muted);
  font: 11px Arial, sans-serif;
}

.model-option {
  display: block;
  width: 100%;
  padding: 9px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  text-align: left;
}

.model-option:hover,
.model-option.active {
  background: var(--soft);
}

.model-option strong,
.model-option small {
  display: block;
}

.model-option strong {
  font-size: 12px;
  font-weight: normal;
}

.model-option small {
  margin-top: 3px;
  overflow: hidden;
  color: var(--muted);
  text-overflow: ellipsis;
  white-space: nowrap;
  font: 9px Arial, sans-serif;
}

dialog {
  width: min(440px, calc(100% - 24px));
  max-height: calc(100dvh - 24px);
  overflow: auto;
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 16px;
  color: var(--text);
  background: var(--panel);
}

dialog::backdrop {
  background: #24211c88;
  backdrop-filter: blur(3px);
}

.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.dialog-head h2 {
  margin: 0;
  font-weight: normal;
}

.close {
  width: 34px;
  height: 34px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  font-size: 22px;
}

.close:hover {
  background: var(--soft);
}

label {
  display: block;
  margin: 18px 0 6px;
  font: 11px Arial, sans-serif;
}

.field {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  outline: 0;
  background: var(--panel);
}

.status {
  min-height: 20px;
  margin-top: 12px;
  color: var(--muted);
  white-space: pre-wrap;
  font: 11px Arial, sans-serif;
}

.actions {
  display: flex;
  justify-content: flex-end;
  gap: 7px;
  margin-top: 18px;
}

.primary {
  padding: 10px 13px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--soft);
  color: var(--text);
  font: 12px Arial, sans-serif;
}

.voice-orb {
  width: 72px;
  height: 72px;
  margin: 32px auto 18px;
  border-radius: 50%;
  background: #77756f;
}

.voice-orb.active {
  animation: voice-pulse 1.2s infinite;
}

.voice-status {
  min-height: 42px;
  color: var(--muted);
  text-align: center;
  font: 13px/1.5 Arial, sans-serif;
}

@keyframes voice-pulse {
  50% {
    transform: scale(.82);
    box-shadow: 0 0 0 18px #77756f18;
  }
}

.profile-list {
  display: grid;
  gap: 6px;
  margin-top: 16px;
}

.profile-list button {
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: transparent;
  text-align: left;
  font: 12px Arial, sans-serif;
}

@media (max-width: 720px) {
  .sidebar {
    position: fixed;
    z-index: 20;
    inset: 0 auto 0 0;
    box-shadow: 20px 0 55px #0003;
  }

  .topbar {
    padding: 10px 12px;
  }

  .connection,
  .page-title {
    display: none;
  }

  .model-trigger {
    max-width: none;
    flex: 1;
  }

  .scroll {
    padding: 24px 13px 19px;
  }

  .composer-area {
    padding: 7px 12px 14px;
  }
}
</style>
</head>

<body>
<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand">nexus</div>

    <button id="new-chat" class="new-chat">
      ＋ Новый
    </button>

    <div id="history" class="history"></div>

    <button id="profile-button" class="profile-button">
      ○ Мой профиль
    </button>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menu-button" class="icon-button">☰</button>

      <button id="model-trigger" class="model-trigger">
        Выбрать модель
      </button>

      <div id="page-title" class="page-title">
        Новый диалог
      </div>

      <div id="connection" class="connection">
        Не подключено
      </div>

      <button id="settings-button" class="icon-button">
        ⚙
      </button>
    </header>

    <section id="scroll" class="scroll">
      <div id="welcome" class="welcome">
        <h1>С чего начнём?</h1>
        <p>
          Задай вопрос, прикрепи изображение
          или начни разговор.
        </p>
      </div>

      <div id="messages" class="messages"></div>

      <div id="waiting" class="waiting hidden">
        <span class="waiting-dot"></span>
        <span id="waiting-text">
          Модель готовит ответ…
        </span>
      </div>
    </section>

    <footer class="composer-area">
      <div class="composer">
        <div id="notice" class="notice"></div>
        <div id="attachments" class="attachments"></div>

        <div class="composer-box">
          <textarea
            id="input"
            placeholder="Напиши сообщение…"
          ></textarea>

          <div class="toolbar">
            <button
              id="attach-button"
              class="toolbar-button"
              title="Прикрепить файл"
            >＋</button>

            <button
              id="talk-button"
              class="toolbar-button"
              title="Разговор с ИИ"
            >◌</button>

            <select id="mode">
              <option value="chat">Чат</option>
              <option value="vision">
                Анализ изображения
              </option>
              <option value="image">
                Создать изображение
              </option>
            </select>

            <button
              id="voice-input-button"
              class="toolbar-button voice-input"
              title="Голосовой ввод"
            >♩</button>

            <button
              id="send-button"
              class="send-button"
              title="Отправить"
            >↑</button>
          </div>
        </div>
      </div>
    </footer>
  </main>
</div>

<input
  id="file-input"
  type="file"
  hidden
  multiple
  accept="image/png,image/jpeg,image/webp,image/gif,.txt,.md,.js,.ts,.py,.json,.html,.css,.csv"
>

<div id="model-picker" class="model-picker hidden"></div>

<dialog id="settings-dialog">
  <div class="dialog-head">
    <h2>Подключение</h2>
    <button class="close" data-close="settings-dialog">×</button>
  </div>

  <label for="worker-url">Адрес Worker</label>
  <input
    id="worker-url"
    class="field"
    value="https://small-recipe-c9fd.zemcovaalena5.workers.dev"
  >

  <label for="app-password">APP_PASSWORD</label>
  <input
    id="app-password"
    class="field"
    type="password"
    autocomplete="off"
  >

  <label for="system-prompt">Инструкция модели</label>
  <textarea
    id="system-prompt"
    class="field"
    rows="3"
  >Отвечай по-русски, ясно и по существу.</textarea>

  <div id="settings-status" class="status"></div>

  <div class="actions">
    <button id="connect-button" class="primary">
      Подключить
    </button>
  </div>
</dialog>

<dialog id="voice-dialog">
  <div class="dialog-head">
    <h2>Разговор с ИИ</h2>
    <button class="close" data-close="voice-dialog">×</button>
  </div>

  <div class="voice-orb" id="voice-orb"></div>

  <div id="voice-status" class="voice-status">
    Нажми «Слушать».
  </div>

  <div class="actions">
    <button id="voice-listen" class="primary">
      Слушать
    </button>

    <button id="voice-stop">
      Остановить
    </button>
  </div>
</dialog>

<dialog id="profiles-dialog">
  <div class="dialog-head">
    <h2>Профили</h2>
    <button class="close" data-close="profiles-dialog">×</button>
  </div>

  <div id="profile-list" class="profile-list"></div>

  <form id="profile-form">
    <label for="profile-name">Имя профиля</label>
    <input id="profile-name" class="field" required maxlength="40">

    <div class="actions">
      <button class="primary">
        Создать профиль
      </button>
    </div>
  </form>
</dialog>

<script>
"use strict";

const DEFAULT_WORKER =
  "https://small-recipe-c9fd.zemcovaalena5.workers.dev";

const STORE = "nexus_clean_v1";

const state = {
  worker: DEFAULT_WORKER,
  password: "",
  system: "Отвечай по-русски, ясно и по существу.",
  profiles: [],
  activeProfile: "",
  models: {
    chat: [],
    vision: [],
    image: []
  },
  mode: "chat",
  selectedModel: "",
  files: [],
  request: null,
  recognition: null
};

const $ = id => document.getElementById(id);

function uid(prefix = "id") {
  return prefix + "_" +
    Date.now() + "_" +
    Math.random().toString(36).slice(2, 8);
}

function note(text) {
  $("notice").textContent = text || "";
}

function currentProfile() {
  return state.profiles.find(
    profile => profile.id === state.activeProfile
  );
}

function currentChat() {
  const profile = currentProfile();

  if (!profile.chats.length) {
    profile.chats.push({
      id: uid("chat"),
      title: "Новый диалог",
      pinned: false,
      messages: []
    });
  }

  if (!profile.chats.some(
    chat => chat.id === profile.currentChat
  )) {
    profile.currentChat = profile.chats[0].id;
  }

  return profile.chats.find(
    chat => chat.id === profile.currentChat
  );
}

function save() {
  localStorage.setItem(STORE, JSON.stringify({
    worker: state.worker,
    system: state.system,
    profiles: state.profiles,
    activeProfile: state.activeProfile,
    selectedModel: state.selectedModel
  }));
}

function load() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(STORE) || "{}"
    );

    state.worker = saved.worker || DEFAULT_WORKER;
    state.system = saved.system || state.system;
    state.profiles = Array.isArray(saved.profiles)
      ? saved.profiles
      : [];
    state.activeProfile = saved.activeProfile || "";
    state.selectedModel = saved.selectedModel || "";
  } catch {
    state.profiles = [];
  }

  if (!state.profiles.length) {
    const profile = {
      id: uid("profile"),
      name: "Мой профиль",
      chats: [{
        id: uid("chat"),
        title: "Новый диалог",
        pinned: false,
        messages: []
      }],
      currentChat: null
    };

    profile.currentChat =
      profile.chats[0].id;

    state.profiles.push(profile);
  }

  if (!state.profiles.some(
    profile => profile.id === state.activeProfile
  )) {
    state.activeProfile =
      state.profiles[0].id;
  }

  currentChat();
}

function normalizeWorker(value) {
  const url = new URL(value.trim());

  if (
    url.protocol !== "https:" ||
    url.pathname !== "/" ||
    url.search ||
    url.hash
  ) {
    throw new Error(
      "Укажи только HTTPS-адрес Worker."
    );
  }

  return url.origin;
}

async function request(path, options = {}) {
  const response = await fetch(
    state.worker + path,
    {
      ...options,
      cache: "no-store",
      credentials: "omit",
      headers: {
        ...(options.headers || {}),
        "X-App-Password": state.password
      }
    }
  );

  const raw = await response.text();
  let data;

  try {
    data = JSON.parse(raw);
  } catch {
    throw new Error("Worker вернул не JSON.");
  }

  if (!response.ok) {
    throw new Error(
      data?.error?.message ||
      data?.message ||
      "Ошибка HTTP " + response.status
    );
  }

  return data;
}

function modelsForMode() {
  if (state.mode === "vision") {
    return state.models.vision.length
      ? state.models.vision
      : state.models.chat.filter(
        model => model.capabilities?.vision
      );
  }

  return state.models[state.mode] || [];
}

function selectFirstModel() {
  const list = modelsForMode();

  if (!list.some(
    model => model.id === state.selectedModel
  )) {
    state.selectedModel =
      list[0]?.id || "";
  }

  updateModelButton();
}

function selectedModel() {
  return modelsForMode().find(
    model => model.id === state.selectedModel
  );
}

function updateModelButton() {
  const model = selectedModel();

  $("model-trigger").textContent =
    model
      ? model.name ||
        model.display_name ||
        model.id
      : "Выбрать модель";
}

function updateConnection() {
  const connected =
    Boolean(state.password) &&
    Object.values(state.models).some(
      list => list.length
    );

function openModelPicker() {

  picker.innerHTML = "";

  const title = document.createElement("div");
  title.className = "picker-title";
  title.textContent = "Модели";

    ["chat", "Чат"],
    ["vision", "Анализ изображений"],
    ["image", "Создание изображений"]
  ];

  sections.forEach(([mode, label]) => {
    const section = document.createElement("section");
    section.className = "model-section";

    const heading = document.createElement("div");
    heading.className = "section-title";
    heading.textContent = label;
    section.append(heading);

    let models;

    if (mode === "vision") {
      models = state.models.vision.length
        ? state.models.vision
        : state.models.chat.filter(
          model => model.capabilities?.vision
        );
    } else {
      models = state.models[mode] || [];
    }

    if (!models.length) {
      const empty = document.createElement("div");
      empty.className = "section-title";
      empty.textContent =
        "Модели не найдены.";
      section.append(empty);
    }

    models.forEach(model => {
      const option = document.createElement("button");
      option.className =
        "model-option" +
        (
          state.mode === mode &&
          state.selectedModel === model.id
            ? " active"
            : ""
        );

      name.textContent =
        model.name ||
        model.display_name ||
        model.id;

        model.display_name || model.id;

      option.append(name, id);

        state.mode = mode;
        $("mode").value = mode;
        state.selectedModel = model.id;
        save();
        updateModelButton();
        closeModelPicker();
      };

    });

  });

  const rect = trigger.getBoundingClientRect();
  const width = Math.min(
    350,
    window.innerWidth - 24
  );

  picker.style.width = width + "px";
  picker.style.left = Math.max(
    12,
    Math.min(
      rect.left,
      window.innerWidth - width - 12
    )
  ) + "px";
  picker.style.top = rect.bottom + 8 + "px";
}

async function connect() {
  const button = $("connect-button");
  const status = $("settings-status");

  button.disabled = true;
  status.textContent = "Подключаюсь…";

  try {
    state.worker = normalizeWorker(
      $("worker-url").value
    );

    state.password =
      $("app-password").value.trim();

    state.system =
      $("system-prompt").value.trim() ||
      "Отвечай по-русски, ясно и по существу.";

    if (!state.password) {
      throw new Error("Введи APP_PASSWORD.");

    const catalog = await request("/catalog");

    state.models.chat =
      Array.isArray(catalog.chat)
        ? catalog.chat
        : [];

    state.models.vision =
      Array.isArray(catalog.vision)
        ? catalog.vision
        : [];

    state.models.image =
      Array.isArray(catalog.image)
        ? catalog.image
        : [];

    save();
    selectFirstModel();
    updateConnection();

    status.textContent =
      "Чат: " + state.models.chat.length +
      "\nАнализ фото: " +

function renderMessages(chat) {
  const box = $("messages");
  box.innerHTML = "";

  chat.messages.forEach(message => {
    const article = document.createElement("article");
    article.className =
      "message " +
      message.role +
      (message.error ? " error" : "");

    const label = document.createElement("div");
    label.className = "message-label";
    label.textContent =
      message.role === "user"
        ? "Ты"
        : message.model || "Ассистент";

    const body = document.createElement("div");
    body.className = "message-body";

    (message.files || []).forEach(file => {
      if (file.kind === "image") {
        const image = document.createElement("img");
        image.src = file.data;
        image.alt = file.name;
        body.append(image);
      }
    });

    (message.images || []).forEach(src => {
      const image = document.createElement("img");
      image.src = src;
      image.alt = "Созданное изображение";
      body.append(image);
    });

    renderText(body, message.text || "");
    article.append(label, body);

    if (message.role === "assistant") {
      const tools = document.createElement("div");
      tools.className = "tools";

      const copy = document.createElement("button");
      copy.textContent = "Скопировать";

      copy.onclick = async () => {
        await navigator.clipboard.writeText(
          message.text || ""
        );
        note("Скопировано.");
      };

      tools.append(copy);
      article.append(tools);
    }

    box.append(article);
  });
}

function renderText(element, text) {
  String(text).split("```").forEach(
    (part, index) => {
      if (index % 2 === 0) {
        element.append(
          document.createTextNode(part)
        );
        return;
      }

      const pre = document.createElement("pre");
      pre.textContent = part;
      element.append(pre);
    }
  );
}

function renderAttachments() {
  const box = $("attachments");
  box.innerHTML = "";

  state.files.forEach((file, index) => {
    const item = document.createElement("button");
    item.className = "attachment";
    item.textContent = file.name + " ×";

    item.onclick = () => {
      state.files.splice(index, 1);
      renderAttachments();
    };

    box.append(item);

function scrollBottom() {
  requestAnimationFrame(() => {
    $("scroll").scrollTop =

  });
}

function setWaiting(active, text) {
  $("waiting").classList.toggle(
    "hidden",
    !active
  );

  $("waiting-text").textContent =
    text || "Модель готовит ответ…";

}

function buildMessages(chat) {
  const result = [{
    role: "system",
    content: state.system
  }];

  chat.messages.forEach(message => {
    if (message.error) return;

    if (message.role === "assistant") {
      result.push({
        role: "assistant",
        content: message.text || ""
      });
      return;
    }

    const parts = [];

    if (message.text) {
      parts.push({
        type: "text",
        text: message.text
      });
    }

    (message.files || []).forEach(file => {
      if (file.kind === "image") {
        parts.push({
          type: "image_url",
          image_url: {
            url: file.data
          }
        });
      }

      if (file.kind === "text") {
        parts.push({
          type: "text",
          text:
            "Файл " + file.name + ":\n" +
            file.text
        });
      }
    });

    if (parts.length) {
      result.push({
        role: "user",
        content: parts.length === 1
          ? parts[0].text
          : parts
      });
    }
  });

  return result;
}

async function sendChat(model, signal) {
  const data = await request(
    "/chat/completions",
    {
      method: "POST",
      signal,
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model,
        messages: buildMessages(
          currentChat()
        ),
        stream: false
      })
    }
  );

  const content =
    data?.choices?.[0]?.message?.content;

  const answer =
    typeof content === "string"
      ? content
      : Array.isArray(content)
        ? content
          .filter(part => part.type === "text")
          .map(part => part.text || "")
          .join("\n")
        : "";

  if (!answer.trim()) {
    throw new Error(
      "Модель вернула пустой ответ."
    );
  }

  return answer;
}

function delay(ms, signal) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(resolve, ms);

    if (signal) {
      signal.addEventListener(
        "abort",
        () => {
          clearTimeout(timer);
          reject(new DOMException(
            "Остановлено.",
            "AbortError"
          ));
        },
        { once: true }
      );
    }
  });
}

function imageUrls(value) {
  const result = [];

  function scan(item, depth = 0) {
    if (!item || depth > 7) return;

    if (typeof item === "string") {
      if (
        item.startsWith("https://") ||
        item.startsWith("data:image/")
      ) {
        result.push(item);
      }

      return;
    }

    if (Array.isArray(item)) {
      item.forEach(
        child => scan(child, depth + 1)
      );
      return;
    }

    if (typeof item === "object") {
      Object.values(item).forEach(
        child => scan(child, depth + 1)
      );
    }
  }

  scan(value);

  return [...new Set(result)].slice(0, 8);
}

async function getImage(url, signal) {
  if (url.startsWith("data:image/")) {
    return url;
  }

  const data = await request(
    "/asset?url=" +
    encodeURIComponent(url),
    { signal }
  );

  if (
    typeof data?.data !== "string" ||
    !data.data.startsWith("data:image/")
  ) {
    throw new Error(
      "Worker не вернул изображение."
    );
  }

  return data.data;
}

async function generateImage(model, prompt, signal) {
  const data = await request(
    "/images/generations",
    {
      method: "POST",
      signal,
      headers: {
        "Content-Type": "application/json",
        "Idempotency-Key": uid("image")
      },
      body: JSON.stringify({
        source: "credits",
        model,
        prompt
      })
    }
  );

  let urls = imageUrls(data);

  if (urls.length) {
    return Promise.all(
      urls.map(url => getImage(url, signal))
    );
  }

  const job =
    data?.job_id ||
    data?.generation_id ||
    data?.data?.job_id ||
    data?.data?.generation_id;

  if (!job) {
    throw new Error(
      "Сервис не вернул изображение или job_id."
    );
  }

  for (let attempt = 0; attempt < 60; attempt++) {
    await delay(2000, signal);

    const status = await request(
      "/images/generations/" +
      encodeURIComponent(job),
      { signal }
    );

    urls = imageUrls(status);

    if (urls.length) {
      return Promise.all(
        urls.map(url => getImage(url, signal))
      );
    }

    const value = String(
      status?.status ||
      status?.state ||
      status?.data?.status ||
      ""
    ).toLowerCase();

    if (
      [
        "failed",
        "error",
        "cancelled",
        "canceled"
      ].includes(value)
    ) {
      throw new Error(
        status?.error?.message ||
        status?.message ||
        "Генерация изображения завершилась ошибкой."
      );
    }
  }

  throw new Error(
    "Изображение не готово за две минуты."
  );
}

async function send() {
  if (state.request) {
    state.request.abort();
    state.request = null;
    setWaiting(false);
    return;
  }

  const text = $("input").value.trim();
  const chat = currentChat();

  if (!text && !state.files.length) return;

  selectFirstModel();

  if (!state.password) {
    $("settings-dialog").showModal();
    $("settings-status").textContent =
      "Сначала подключи Worker.";
    return;
  }

  if (!state.selectedModel) {
    note(
      "Для этого режима нет подходящей модели."
    );
    openModelPicker();
    return;
  }

  const files = structuredClone(state.files);

  if (!chat.messages.length) {
    chat.title =
      (
        text ||
        files[0]?.name ||
        "Новый диалог"
      ).slice(0, 42);
  }

  chat.messages.push({
    role: "user",
    text,
    files
  });

  $("input").value = "";
  $("input").style.height = "auto";
  state.files = [];

  renderAttachments();
  save();
  render();

  const controller = new AbortController();
  state.request = controller;

  try {
    if (state.mode === "image") {
      setWaiting(true, "Создаю изображение…");

      const placeholder = {
        role: "assistant",
        text: "Создаю изображение…",
        images: [],
        model: "Изображение"
      };

      chat.messages.push(placeholder);
      render();

      placeholder.images =
        await generateImage(
          state.selectedModel,
          text,
          controller.signal
        );

      placeholder.text = "Изображение создано.";
    } else {
      setWaiting(
        true,
        state.mode === "vision"
          ? "Анализирую изображение…"
          : "Модель готовит ответ…"
      );

      const answer = await sendChat(
        state.selectedModel,
        controller.signal
      );

      const model =
        modelsForMode().find(
          item => item.id === state.selectedModel
        );

      chat.messages.push({
        role: "assistant",
        text: answer,
        model:
          model?.name ||
          model?.display_name ||
          state.selectedModel
      });
    }

    save();
    render();
  } catch (error) {
    if (error.name !== "AbortError") {
      chat.messages.push({
        role: "assistant",
        text: error.message,
        error: true
      });

      save();
      render();
    }
  } finally {
    if (state.request === controller) {
      state.request = null;
      setWaiting(false);
    }
  }
}

function addFiles(files) {
  Array.from(files).forEach(async file => {
    const image =
      /^image\/(png|jpeg|webp|gif)$/.test(
        file.type
      );

    const text =
      /\.(txt|md|js|ts|py|json|html|css|csv)$/i
        .test(file.name);

    if (!image && !text) {
      note("Этот тип файла не поддерживается.");
      return;
    }

    if (image && file.size > 3 * 1024 * 1024) {
      note("Изображение больше 3 МБ.");
      return;
    }

    if (text && file.size > 300 * 1024) {
      note("Текстовый файл больше 300 КБ.");
      return;
    }

    if (image) {
      const reader = new FileReader();

      reader.onload = () => {
        state.files.push({
          kind: "image",
          name: file.name,
          type: file.type,
          data: reader.result
        });

        state.mode = "vision";
        $("mode").value = "vision";
        selectFirstModel();
        renderAttachments();
      };

      reader.readAsDataURL(file);
      return;
    }

    state.files.push({
      kind: "text",
      name: file.name,
      text: await file.text()
    });

    renderAttachments();
  });
}

/* Голосовой ввод в поле */

function startDictation() {
  const Speech =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Speech) {
    note(
      "В этом браузере голосовой ввод недоступен."
    );
    return;
  }

  if (state.recognition) {
    try {
      state.recognition.stop();
    } catch {}
    return;
  }

  const recognition = new Speech();
  state.recognition = recognition;

  recognition.lang = "ru-RU";
  recognition.continuous = false;
  recognition.interimResults = true;

  let text = "";

  recognition.onresult = event => {
    text = Array.from(event.results)
      .map(result => result[0].transcript)
      .join(" ");

    $("input").value = text;
    $("input").dispatchEvent(new Event("input"));
  };

  recognition.onerror = event => {
    note(
      event.error === "not-allowed"
        ? "Браузер запретил голосовой ввод."
        : "Ошибка: " + event.error
    );

    state.recognition = null;
  };

  recognition.onend = () => {
    state.recognition = null;
  };

  try {
    recognition.start();
    note("Слушаю…");
  } catch {
    state.recognition = null;
    note("Не удалось запустить микрофон.");
  }
}

/* Голосовой разговор без сообщений в обычном чате */

let talkRecognition = null;
let talkActive = false;

function openTalk() {
  $("voice-dialog").showModal();
  $("voice-status").textContent =
    "Нажми «Слушать».";
}

function stopTalk() {
  talkActive = false;

  if (talkRecognition) {
    try {
      talkRecognition.stop();
    } catch {}

    talkRecognition = null;
  }

  speechSynthesis?.cancel();
  $("voice-orb").classList.remove("active");
}

function startTalk() {
  const Speech =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Speech) {
    $("voice-status").textContent =
      "Голосовой разговор недоступен.";
    return;
  }

  const model =
    state.models.chat.find(
      item => item.id === state.selectedModel
    );

  if (!state.password || !model) {
    $("voice-status").textContent =
      "Выбери модель в разделе «Чат».";
    return;
  }

  stopTalk();
  talkActive = true;

  const recognition = new Speech();
  talkRecognition = recognition;

  recognition.lang = "ru-RU";
  recognition.continuous = false;
  recognition.interimResults = false;

  let text = "";

  recognition.onstart = () => {
    $("voice-orb").classList.add("active");
    $("voice-status").textContent =
      "Слушаю…";
  };

  recognition.onresult = event => {
    text = Array.from(event.results)
      .map(result => result[0].transcript)
      .join(" ")
      .trim();
  };

  recognition.onerror = event => {
    $("voice-orb").classList.remove("active");
    talkActive = false;
    $("voice-status").textContent =
      event.error === "not-allowed"
        ? "Браузер запретил распознавание речи."
        : "Ошибка: " + event.error;
  };

  recognition.onend = async () => {
    $("voice-orb").classList.remove("active");

    if (!talkActive || !text) {
      $("voice-status").textContent =
        "Речь не распознана.";
      return;
    }

    $("voice-status").textContent =
      "Думаю…";

    try {
      const response = await request(
        "/chat/completions",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: model.id,
            messages: [
              {
                role: "system",
                content:
                  state.system +
                  "\nОтвечай кратко, естественно и без Markdown. " +
                  "Ответ будет озвучен голосом."
              },
              {
                role: "user",
                content: text
              }
            ],
            stream: false
          })
        }
      );

      const content =
        response?.choices?.[0]?.message?.content;

      const answer =
        typeof content === "string"
          ? content
          : Array.isArray(content)
            ? content
              .filter(part => part.type === "text")
              .map(part => part.text || "")
              .join("\n")
            : "";

      if (!answer.trim()) {
        throw new Error("Пустой ответ модели.");
      }

      $("voice-status").textContent =
        "Говорю…";

      const utterance =
        new SpeechSynthesisUtterance(answer);

      utterance.lang = "ru-RU";
      utterance.rate = .98;

      utterance.onend = () => {
        if (talkActive) {
          $("voice-status").textContent =
            "Нажми «Слушать» для следующей реплики.";
        }
      };

      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    } catch (error) {
      $("voice-status").textContent =
        error.message;
    }
  };

  try {
    recognition.start();
  } catch {
    talkActive = false;
    $("voice-status").textContent =
      "Не удалось начать слушание.";
  }
}

function openProfiles() {
  const list = $("profile-list");
  list.innerHTML = "";

  state.profiles.forEach(profile => {
    const button = document.createElement("button");

    button.textContent =
      (
        profile.id === state.activeProfile

      ) + profile.name;

    button.onclick = () => {
      state.activeProfile = profile.id;
      state.files = [];
      save();
      render();
      $("profiles-dialog").close();
    };

    list.append(button);
  });

  $("profiles-dialog").showModal();
}

/* Events */

$("new-chat").onclick = createChat;
$("send-button").onclick = send;

$("input").onkeydown = event => {
  if (
    event.key === "Enter" &&
    !event.shiftKey &&
    !event.isComposing
  ) {
    event.preventDefault();
    send();
  }
};

$("input").oninput = () => {
  $("input").style.height = "auto";
  $("input").style.height =
    Math.min(
      $("input").scrollHeight,
      210
    ) + "px";
};

$("attach-button").onclick = () =>
  $("file-input").click();

$("file-input").onchange = event => {
  addFiles(event.target.files);
  event.target.value = "";
};

$("voice-input-button").onclick =
  startDictation;

$("talk-button").onclick = openTalk;

$("voice-listen").onclick = startTalk;
$("voice-stop").onclick = () => {
  stopTalk();
  $("voice-status").textContent =
    "Остановлено.";
};

$("mode").onchange = () => {
  state.mode = $("mode").value;
  selectFirstModel();
};

$("model-trigger").onclick = event => {
  event.stopPropagation();

  if (
    $("model-picker").classList.contains("hidden")
  ) {
    openModelPicker();
  } else {
    closeModelPicker();
  }
};

document.addEventListener("click", event => {
  if (
    !event.target.closest("#model-picker") &&
    !event.target.closest("#model-trigger")
  ) {
    closeModelPicker();
  }
});

$("menu-button").onclick = () => {
  $("sidebar").classList.toggle("closed");
};

$("settings-button").onclick = () => {
  $("worker-url").value = state.worker;
  $("app-password").value = state.password;
  $("system-prompt").value = state.system;
  $("settings-dialog").showModal();
};

$("connect-button").onclick = connect;
$("profile-button").onclick = openProfiles;

$("profile-form").onsubmit = event => {
  event.preventDefault();

  const name =
    $("profile-name").value.trim();

  if (!name) return;

  const profile = {
    id: uid("profile"),
    name,
    chats: [{
      id: uid("chat"),
      title: "Новый диалог",
      pinned: false,
      messages: []
    }],
    currentChat: null
  };

  profile.currentChat =
    profile.chats[0].id;

  state.profiles.push(profile);
  state.activeProfile = profile.id;

  $("profile-name").value = "";

  save();
  render();
  $("profiles-dialog").close();
};

document.querySelectorAll("[data-close]").forEach(
  button => {
    button.onclick = () => {
      if (button.dataset.close === "voice-dialog") {
        stopTalk();
      }

      $(button.dataset.close).close();
    };
  }
);

load();

$("worker-url").value = state.worker;
$("system-prompt").value = state.system;

render();

setTimeout(() => {
  if (!state.password) {
    $("settings-dialog").showModal();
  }
}, 300);
</script>
</body>
</html>
